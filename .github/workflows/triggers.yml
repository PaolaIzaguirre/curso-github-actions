name: Triggers
run-name: Laboratorio con triggers

on:
    push: 
        branches:
            - main
    pull_request:
        types: [opened, synchronize]
        paths:
            - '**.py'
    issues:
        types:
            - labeled
    workflow_dispatch:
        inputs:
            lenguaje-favorito:
                description: 'Lenguaje Favorito'
                default: C#
                required: true
                type: choice
                options:
                    - Python
                    - C#
                    - Java
                    - JavaScript
                    - PHP
            nombre: 
                description: 'Tu nombre'
                required: true
                default: Paola
                type: string
    schedule:
        - cron:  '15 22 * * *'
jobs:
    hola-mundo-manual:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Definir nombre
              run: echo "USERNAME=${{ inputs.nombre }}" >> $GITHUB_ENV
            - name: Definir lenguaje
              run: echo "LANGUAGE=${{ inputs.lenguaje_favorito }}" >> $GITHUB_ENV
            - name: Correr script
              run: python hola_mundo.py
    hola-mundo:
        if: ${{ github.event_name != 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Definir variable
              run: echo "USERNAME=${{ github.actor }}" >> $GITHUB_ENV
            - name: Correr script
              run: python hola_mundo.py
